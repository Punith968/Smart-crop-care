name: Quality

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Compile Python files
        run: python -m compileall -q app disease_detection_src scripts
      - name: Run tests
        run: python -m pytest -q tests

  web-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
